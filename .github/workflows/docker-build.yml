name: Docker Build (Layer Caching)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # needed for attestations
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        # Enable advanced features
        driver-opts: |
          network=host

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Convert repository name to lowercase
      id: lowercase
      run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    # Flag whether we can safely use the registry cache (i.e., not a forked PR)
    - name: Decide registry cache availability
      id: cacheflag
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
          echo "use_registry_cache=false" >> $GITHUB_OUTPUT
        else
          echo "use_registry_cache=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        # Always: GHA cache
        cache-from: |
          type=gha
          ${{ steps.cacheflag.outputs.use_registry_cache == 'true' && format('type=registry,ref={0}/{1}:buildcache', env.REGISTRY, steps.lowercase.outputs.image_name) || '' }}
        cache-to: |
          type=gha,mode=max
          ${{ steps.cacheflag.outputs.use_registry_cache == 'true' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, steps.lowercase.outputs.image_name) || '' }}

        # Security / supply chain
        provenance: true                       # SLSA-style provenance
        attests: type=provenance,mode=max      # detailed attestation
        sbom: true                             # generate SBOM

        # Multi-stage build optimization
        target: runtime